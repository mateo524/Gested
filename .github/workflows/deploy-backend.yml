name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'proyecto-hr/backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit proyecto-hr/backend \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/zentor-backend \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy zentor-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/zentor-backend \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production" \
            --set-secrets="MONGO_URI=MONGO_URI:latest,JWT_SECRET=JWT_SECRET:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,HUBSPOT_PAT=HUBSPOT_PAT:latest" \
            --project ${{ secrets.GCP_PROJECT_ID }}
