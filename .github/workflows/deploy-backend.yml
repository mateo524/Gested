name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'proyecto-hr/backend/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: zentor-cloud-credits-guardrail
  REGION: us-east1
  SERVICE: zentor-backend
  IMAGE: us-east1-docker.pkg.dev/zentor-cloud-credits-guardrail/zentor-backend/app
  WIF_PROVIDER: projects/201875892373/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SA: zentor-github-actions@zentor-cloud-credits-guardrail.iam.gserviceaccount.com

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proyecto-hr/backend/package-lock.json

      - name: Install dependencies
        run: npm install --prefix proyecto-hr/backend --no-audit --legacy-peer-deps

      - name: Run tests
        run: npm test --prefix proyecto-hr/backend
        continue-on-error: true

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: vars.DEPLOY_TO_CLOUD_RUN == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            proyecto-hr/backend
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Write env vars file
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_COMPANY_NAME: ${{ secrets.SEED_COMPANY_NAME }}
          SEED_COMPANY_SLUG: ${{ secrets.SEED_COMPANY_SLUG }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REDIRECT_URI: ${{ secrets.LINKEDIN_REDIRECT_URI }}
          CONTACT_NOTIFICATIONS_TO: ${{ secrets.CONTACT_NOTIFICATIONS_TO }}
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_BACKEND }}
        run: |
          # Single-quoted YAML values prevent & from being interpreted as an anchor
          node -e "
          const vars = {
            NODE_ENV: 'production',
            MONGO_URI: process.env.MONGO_URI,
            JWT_SECRET: process.env.JWT_SECRET,
            SENDGRID_API_KEY: process.env.SENDGRID_API_KEY,
            FRONTEND_URL: process.env.FRONTEND_URL,
            SEED_ADMIN_EMAIL: process.env.SEED_ADMIN_EMAIL,
            SEED_ADMIN_PASSWORD: process.env.SEED_ADMIN_PASSWORD,
            SEED_COMPANY_NAME: process.env.SEED_COMPANY_NAME,
            SEED_COMPANY_SLUG: process.env.SEED_COMPANY_SLUG,
            LINKEDIN_CLIENT_ID: process.env.LINKEDIN_CLIENT_ID,
            LINKEDIN_CLIENT_SECRET: process.env.LINKEDIN_CLIENT_SECRET,
            LINKEDIN_REDIRECT_URI: process.env.LINKEDIN_REDIRECT_URI,
            CONTACT_NOTIFICATIONS_TO: process.env.CONTACT_NOTIFICATIONS_TO,
            HUBSPOT_PAT: process.env.HUBSPOT_PAT,
            SLACK_WEBHOOK_URL: process.env.SLACK_WEBHOOK_URL,
            SENTRY_DSN: process.env.SENTRY_DSN,
          };
          const lines = Object.entries(vars)
            .filter(([, v]) => v)
            .map(([k, v]) => k + \": '\" + v.replace(/'/g, \"'\\\\''\" ) + \"'\");
          require('fs').writeFileSync('.cloud-run-env.yaml', lines.join('\n') + '\n');
          "

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 3 \
            --memory 512Mi \
            --port 8080 \
            --env-vars-file .cloud-run-env.yaml \
            --project ${{ env.PROJECT_ID }}

      - name: Print deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)" \
            --project ${{ env.PROJECT_ID }})
          echo "✅ Backend live at: $URL"
          echo "CLOUD_RUN_URL=$URL" >> $GITHUB_ENV
