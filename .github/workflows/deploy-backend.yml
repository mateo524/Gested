name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'proyecto-hr/backend/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proyecto-hr/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix proyecto-hr/backend

      - name: Run tests
        run: npm test --prefix proyecto-hr/backend
        continue-on-error: true

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    # Only deploys when the DEPLOY_TO_CLOUD_RUN repo variable is set to 'true'
    # Set it at: github.com/mateo524/Gested → Settings → Variables → Actions
    if: vars.DEPLOY_TO_CLOUD_RUN == 'true'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit proyecto-hr/backend \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/zentor-backend \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy zentor-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/zentor-backend \
            --region ${{ secrets.GCP_REGION || 'us-east1' }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --set-env-vars="NODE_ENV=production" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Print service URL
        run: |
          gcloud run services describe zentor-backend \
            --region ${{ secrets.GCP_REGION || 'us-east1' }} \
            --format "value(status.url)"
