name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'proyecto-hr/backend/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: zentor-cloud-credits-guardrail
  REGION: us-east1
  SERVICE: zentor-backend
  WIF_PROVIDER: projects/201875892373/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SA: zentor-github-actions@zentor-cloud-credits-guardrail.iam.gserviceaccount.com

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proyecto-hr/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix proyecto-hr/backend

      - name: Run tests
        run: npm test --prefix proyecto-hr/backend
        continue-on-error: true

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: vars.DEPLOY_TO_CLOUD_RUN == 'true'
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit proyecto-hr/backend \
            --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --set-env-vars="NODE_ENV=production" \
            --project ${{ env.PROJECT_ID }}

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "✅ Deployed: $URL"
