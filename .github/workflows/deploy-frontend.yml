name: Validate Frontend Build

on:
  push:
    branches: [main]
    paths:
      - 'proyecto-hr/src/**'
      - 'proyecto-hr/*.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proyecto-hr/package-lock.json

      - name: Install dependencies
        working-directory: proyecto-hr
        run: npm ci

      - name: Build
        working-directory: proyecto-hr
        run: npm run build
