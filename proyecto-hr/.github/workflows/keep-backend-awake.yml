name: Keep Render backend awake

# Render's free web-service plan sleeps after ~15 min without requests; the
# next request then pays a 20-50s cold start. Pinging /health periodically
# keeps the instance warm so real user requests don't hit that cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 30 https://gested-1-backend.onrender.com/health
